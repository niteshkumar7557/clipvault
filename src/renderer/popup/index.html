<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>ClipVault</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="window-container">
    <!-- Header -->
    <header class="window-header">
      <div class="app-brand">
        <span class="app-icon">📋</span>
        <h1 class="app-title">ClipVault</h1>
      </div>
      <div class="header-right">
        <button id="open-settings-btn" class="header-icon-btn" title="Open Settings Window">⚙️</button>
        <div class="shortcut-pill" title="Global shortcut">
          <kbd>⇧⌘V</kbd>
        </div>
      </div>
    </header>

    <!-- Tab Bar: History vs Snippets -->
    <div class="tab-bar">
      <button id="tab-history-btn" class="tab-btn active">
        <span>History</span>
        <span id="history-count-badge" class="tab-badge">0</span>
      </button>
      <button id="tab-snippets-btn" class="tab-btn">
        <span>Snippets</span>
        <span id="snippets-count-badge" class="tab-badge">0</span>
      </button>
    </div>

    <!-- Search & Action Section -->
    <div class="search-section">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search history..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button id="clear-search-btn" class="clear-search-btn" style="display: none;" title="Clear search">✕</button>
      </div>
      <button id="add-snippet-btn" class="add-snippet-btn" style="display: none;" title="Create new snippet">+ New</button>
    </div>

    <!-- Main Content Area -->
    <main class="window-content">
      <!-- 1. History Tab View -->
      <div id="history-view" class="tab-view active">
        <div id="history-empty" class="empty-state">
          <div class="empty-icon" id="empty-icon">✂️</div>
          <h3 id="empty-title">No clipboard history</h3>
          <p id="empty-desc">Copy any text with <kbd>⌘C</kbd> to record it here.</p>
        </div>
        <ul id="history-list" class="history-list" style="display: none;"></ul>
      </div>

      <!-- 2. Snippets Tab View -->
      <div id="snippets-view" class="tab-view" style="display: none;">
        <div id="snippets-empty" class="empty-state" style="display: none;">
          <div class="empty-icon">📝</div>
          <h3>No snippets yet</h3>
          <p>Create reusable text snippets for fast access anytime.</p>
          <button id="empty-add-snippet-btn" class="primary-btn">Create First Snippet</button>
        </div>
        <ul id="snippets-list" class="snippets-list"></ul>
      </div>
    </main>

    <!-- Snippet Modal (Create & Edit) -->
    <div id="snippet-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h3 id="modal-title">New Snippet</h3>
        <div class="form-group">
          <label for="snippet-title-input">Title</label>
          <input type="text" id="snippet-title-input" placeholder="e.g. Email signature" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="snippet-tags-input">Tags <span class="label-hint">(comma separated)</span></label>
          <input type="text" id="snippet-tags-input" placeholder="e.g. work, email" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="snippet-content-input">Content</label>
          <textarea id="snippet-content-input" rows="4" placeholder="Snippet content to copy..."></textarea>
        </div>
        <div class="modal-actions">
          <button id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button id="modal-save-btn" class="btn btn-primary">Save Snippet</button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="window-footer">
      <div class="nav-hints">
        <span class="hint-item"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span class="hint-item"><kbd>↵</kbd> Copy</span>
        <span class="hint-item"><kbd>Esc</kbd> Close</span>
        <span class="hint-item">Right-click Menu</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
