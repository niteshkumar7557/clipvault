<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>ClipVault</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="window-container">
    <!-- Header Area -->
    <header class="window-header">
      <div class="app-brand">
        <span class="app-icon">📋</span>
        <h1 class="app-title">ClipVault</h1>
        <span id="item-count-badge" class="badge">0</span>
      </div>
      <div class="header-actions">
        <!-- Allows toggling stay-on-top so user can test live updates while copying in other apps -->
        <button id="pin-window-btn" class="icon-toggle-btn active" title="Toggle keep window open on blur">
          <span class="pin-icon">📌</span>
          <span id="pin-status-text" class="btn-label">Pinned</span>
        </button>
      </div>
    </header>

    <!-- Content Area: History List -->
    <main class="window-content">
      <!-- Empty State -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">✂️</div>
        <h3>No clipboard history yet</h3>
        <p>Copy any text (<code>⌘C</code>) in any macOS app to see it captured here live.</p>
      </div>

      <!-- History Items List -->
      <ul id="history-list" class="history-list" style="display: none;">
        <!-- Dynamically populated via popup.js -->
      </ul>
    </main>

    <!-- Window Footer -->
    <footer class="window-footer">
      <span class="watcher-status">
        <span class="status-dot live"></span>
        Clipboard watcher active (500ms)
      </span>
      <button id="quick-ping-btn" class="quick-ping-btn" title="Verify IPC bridge">Ping IPC</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
