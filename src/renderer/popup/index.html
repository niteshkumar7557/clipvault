<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>ClipVault</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="window-container">
    <!-- Header -->
    <header class="window-header">
      <div class="app-brand">
        <span class="app-icon">📋</span>
        <h1 class="app-title">ClipVault</h1>
        <span id="item-count-badge" class="badge">0</span>
      </div>
      <div class="shortcut-pill" title="Global shortcut">
        <kbd>⇧⌘V</kbd>
      </div>
    </header>

    <!-- Search Bar per Milestone 5 -->
    <div class="search-section">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search clips..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <button id="clear-search-btn" class="clear-search-btn" style="display: none;" title="Clear search">✕</button>
      </div>
    </div>

    <!-- Content: History Items List -->
    <main class="window-content">
      <!-- Empty State -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" id="empty-icon">✂️</div>
        <h3 id="empty-title">No clipboard history</h3>
        <p id="empty-desc">Copy any text with <kbd>⌘C</kbd> to record it here.</p>
      </div>

      <!-- History Items -->
      <ul id="history-list" class="history-list" style="display: none;">
        <!-- Populated dynamically via popup.js -->
      </ul>
    </main>

    <!-- Footer: Keyboard Navigation & Context Menu Hints -->
    <footer class="window-footer">
      <div class="nav-hints">
        <span class="hint-item"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span class="hint-item"><kbd>↵</kbd> Copy</span>
        <span class="hint-item"><kbd>Esc</kbd> Close</span>
        <span class="hint-item">Right-click Menu</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
